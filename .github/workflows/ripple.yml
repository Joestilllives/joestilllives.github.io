name: Ripple alerts

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ripple
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test engine
        run: python ripple/tests/test_engine.py
      - name: Fetch news and find hidden links
        run: cd ripple && python run.py
      - name: Publish results
        run: |
          git config user.name "ripple-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ripple/output
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Ripple: update alerts"
          git push
