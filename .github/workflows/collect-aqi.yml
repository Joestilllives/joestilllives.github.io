name: Collect AQI data

on:
  schedule:
    - cron: '17 * * * *'   # hourly, at :17
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: collect-aqi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
        run: node scripts/collect-aqi.js

      - name: Commit data
        run: |
          git config user.name "aqi-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aqi/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "AQI data $(date -u +%Y-%m-%dT%H:00Z)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
